spring.application.name=library-management-system
server.port=${PORT:8080}

# Default profile is h2 for instant zero-configuration startup.
# To switch to postgres, pass -Dspring-boot.run.profiles=postgres or set SPRING_PROFILES_ACTIVE=postgres
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

spring.jpa.open-in-view=false
logging.level.com.library=INFO
